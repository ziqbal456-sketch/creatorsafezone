<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Reproduce the TikTok planning preset</title><desc id="desc">The editable estimate uses top 160, right 180, bottom 420 and left 0 on a 1080 by 1920 canvas. These values are not measured TikTok interface bounds.</desc><rect width="1000" height="720" rx="20" fill="#19191f"/><g font-family="system-ui,sans-serif" fill="#f7f7fa"><text x="45" y="65" font-size="29" font-weight="700">A preset you can reproduce</text><text x="45" y="105" font-size="19" fill="#c3bce3">TikTok organic planning estimate · 1080 × 1920</text><g transform="translate(80 145) scale(.25)"><rect width="1080" height="1920" fill="#5d2537"/><rect x="0" y="160" width="900" height="1340" fill="#253c2d" stroke="#d5ff5f" stroke-width="8"/><text x="450" y="800" text-anchor="middle" font-size="74">900 × 1340</text><text x="450" y="900" text-anchor="middle" font-size="60">working area</text></g><g font-size="23"><text x="440" y="230">Left = 0</text><text x="440" y="285">Top = 160</text><text x="440" y="340">Right = 1080 − 180 = 900</text><text x="440" y="395">Bottom = 1920 − 420 = 1500</text><text x="440" y="470" fill="#d5ff5f">Width = 900 · Height = 1340</text><text x="440" y="540" font-size="19">Calculation verified. App measurement pending.</text></g><text x="45" y="675" font-size="18" fill="#c3bce3">Your result depends on the selected margins. Confirm the final layout in the destination app.</text></g></svg>